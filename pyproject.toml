[project]
name = "factory"
version = "0.1.0"
description = "BMS video factory — production autonome de vidéos YouTube faceless, 100 % local"
readme = "docs/INSTALL.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }

# Versions épinglées à ce qui a été MESURÉ aux étapes 5.1 et 5.2 sur cette machine
# (MacBook Air M2, 16 Go, macOS 27). Ne pas « moderniser » sans repasser le banc :
# chaque pin ci-dessous correspond à une mesure de benchmarks/RESULTATS.md.
dependencies = [
    # --- socle numérique et Metal/MPS -------------------------------------
    "torch==2.14.0",              # MPS actif — étape 5.2
    "torchaudio==2.11.0",
    "numpy==2.5.3",
    "accelerate==1.12.0",
    # transformers 4.57 refuse huggingface-hub >= 1.0 ; diffusers 0.40 l'exige.
    # Conflit rencontré et résolu en 5.2 : les trois lignes suivantes vont ensemble.
    "transformers==4.57.3",
    "diffusers==0.35.1",
    "huggingface-hub==0.36.2",
    # --- TTS (brique 2) ---------------------------------------------------
    "qwen-tts==0.1.1",            # Qwen3-TTS-12Hz-1.7B-CustomVoice, fp16/MPS
    "soundfile==0.14.0",
    # --- ASR (brique 3) ---------------------------------------------------
    "parakeet-mlx==0.5.2",        # principal
    "mlx-whisper==0.4.3",         # repli (troncatures de parakeet)
    # --- LLM (brique 1) : llama.cpp par Homebrew, pas de paquet Python.
    "gguf==0.19.0",               # lecture des métadonnées des poids GGUF
    "sentencepiece==0.2.2",
    # --- image et profondeur (briques 4 et 5) -----------------------------
    # mflux est installé HORS de cet environnement (`uv tool install mflux`) :
    # il tire sa propre pile MLX et casserait la pile audio. Voir docs/INSTALL.md.
    "pillow==12.3.0",
    # --- whiteboard, miniatures (briques 9 et 11) -------------------------
    "vtracer==0.6.15",
    "playwright==1.62.0",
    # --- banc de mesure (brique 12) ---------------------------------------
    "scenedetect[opencv]>=0.6.4",
    "imagehash==4.3.2",
    "jiwer==4.0.0",
    # --- publication YouTube (étapes 13 et 14) ----------------------------
    "google-api-python-client>=2.180",
    "google-auth-oauthlib>=1.2",
    # --- ossature ---------------------------------------------------------
    "pydantic>=2.13",
    "typer==0.27.2",
    "rich==15.0.0",
    "pyyaml==6.0.3",
    "python-dotenv>=1.1",
    "requests==2.34.2",
    "streamlit>=1.64.0",
    "rembg[cpu]>=2.0.85",
]

[project.scripts]
factory = "factory.cli:app"

[dependency-groups]
dev = ["pytest>=8.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["factory"]

[tool.uv]
# Les roues MLX et torch sont arm64 : aucune compilation, aucun repli x86.
package = true
