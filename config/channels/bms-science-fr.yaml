schema_version: "1.0"
# Déclinaison française de la chaîne science. Le français n'est pas sur le chemin critique
# (arbitrage d'Alek du 15/09/2026) : cette configuration existe pour que le multi-langues
# soit exercé par les tests, pas pour publier demain.
id: bms-science-fr
name: "BMS Science FR"
lang: fr                        # doit exister dans config/languages/
niche: science_pop              # doit exister dans config/niches/
style: illustre                 # doit exister dans config/styles/
templates: [sci-a, sci-b, sci-c]        # >= 3, rotation exigée par CONFORMITE § 5
charte:
  version: "2026.09.1-fr"
  fonts: { title: "Inter SemiBold", body: "Inter Regular" }
  palette: { bg: "#101820", text: "#ffffff", text_outline: "#0a0a0a",
             accent: "#2f9e8f", highlight: "#ffd166" }
  transitions: [cut, fade, dip_black]   # le moteur ne peut en employer aucune autre
  subtitles: { align: bottom_center, margin_v_px: 96, size_px: 64,
               max_chars_per_line: 38, max_lines: 2, karaoke: true, burn_in: false }
  framing: { person_shots: bust_only, prefer: [objet, lieu, schema, abstraction],
             background: "uncluttered single-tone background that reaches every edge of the frame",
             subject_scale: "single subject filling about two thirds of the frame, centered, no border" }
  # Style d'image de la chaîne — lu par `factory/assets/images.py`, jamais en dur dans un moteur.
  # Le préfixe est employé **mot pour mot** sur toutes les images : c'est lui qui tient la
  # cohérence, pas la graine (une graine fixe ne fige que le bruit initial). Le fond et l'échelle
  # du sujet sont écrits ici parce que, laissés au modèle, ils changent d'un plan à l'autre —
  # un plan sur huit encadré d'une marge quand les autres allaient au bord (étape 5.2 § 2.11).
  style_prefix: >-
    flat vector editorial illustration, bold clean outlines, limited palette of deep teal #2f9e8f, warm amber #ffd166 and dark slate #101820, soft paper grain, simple geometric shapes, even diffuse light
  style_suffix: >-
    smooth matte surfaces, uniform colour fields, soft even shading, calm confident mood, 16:9 cinematic composition
voice_id: serena_fr             # doit appartenir à config/languages/fr.yaml
cadence:
  per_week_max: 2               # plafond dur des 90 premiers jours, CONFORMITE § 6
  days: [tuesday, saturday]     # créneaux de la niche (REFERENTIEL : mardi, samedi, vendredi)
  hours_local: ["18:00"]        # 16 h UTC, deuxième créneau de la niche
  jitter_min: 90                # ± 90 min autour du créneau (fenêtre de 3 h), étape 23.2
  timezone: "Europe/Paris"
google_account:
  alias: bms-science-fr
  brand_account: "BMS Science FR"
  owner: BMS
  gcp_project: bms-factory      # projet unique, identique pour toutes les chaînes
  token_ref: "secrets/tokens/bms-science-fr.json"   # référence, jamais la valeur
  two_fa_enabled: false         # à activer à la création du compte (étape 13)
  phone_verified: false
products: []                    # ids de config/products/ ; non vide => paid_promotion
derive_from: null
auto_approve: false             # true retirerait l'exception éditoriale RIA pour cette chaîne
youtube:
  audit_passed: false           # tant que false, publish_path = manual_studio
  channel_id: null
  playlist_id: null
  captions_upload: true         # exclusif de charte.subtitles.burn_in
  category_id: "28"            # Science et technologie — snippet.categoryId de videos.insert
  notify_subscribers: true      # faux pour un rattrapage de retard : pas 4 notifications le même jour
library:
  cooldown_videos: 10
  max_uses_per_channel: 3
