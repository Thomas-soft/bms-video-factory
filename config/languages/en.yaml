schema_version: "1.0"
code: en
name: "English"
# Voix : `note_ecoute` reste null tant que personne n'a écouté la voix (étape 7, SUIVI § 1).
# Les voix kokoro sont déclarées d'après le catalogue publié du moteur ; le moteur n'est pas
# installé et l'arbitrage de licence (chaîne GPL de misaki/espeak-ng) n'est pas rendu.
voices:
  - { id: serena_en, engine: qwen3_tts, gender: f, native: false, note_ecoute: null }
  # Ajoutée à l'étape 17 pour `bms-histoire-en` : CONFORMITE § 5 refuse deux chaînes de même
  # langue sur la même voix, et `serena_en` est prise par `bms-science-en`. Le nom vient du
  # `spk_id` des poids (`config.json` : serena, vivian, uncle_fu, ryan, aiden, ono_anna, sohee,
  # eric, dylan — les deux derniers sont des dialectes chinois). **Jamais écoutée** : à écouter
  # avant le premier run de production de la chaîne (SUIVI § 1).
  - { id: ryan_en, engine: qwen3_tts, gender: m, native: false, note_ecoute: null }
  - { id: kokoro_af_heart, engine: kokoro, gender: f, native: true, note_ecoute: null }
  - { id: kokoro_am_michael, engine: kokoro, gender: m, native: true, note_ecoute: null }
typographie:
  espace_avant_double_ponctuation: false
  guillemets: ["“", "”"]
  majuscules_titre: title_case
nombres:
  decimal: "."
  milliers: ","
  pourcent: "18%"
  date: "September 18, 2026"
  unites: imperial_first
disclosure:
  # Phrase contractuelle d'Amazon Partenaires : reprise mot pour mot, jamais traduite ici.
  amazon: "As an Amazon Associate I earn from qualifying purchases."
  impact: ["#ad", "#sponsored"]          # liste fermée du réseau
  awin: ["#Ad", "#PaidAd"]               # liste fermée du réseau
  overlay_generic: "Paid promotion"
  virtual_images: "AI-generated imagery"
  # CONFORMITE § 3 couche 1 : l'assistance de production (script, voix, illustrations)
  # n'oblige PAS `containsSyntheticMedia` ; la dire en description est une décision de
  # BMS, et c'est elle qui rend l'exception éditoriale du RIA art. 50 lisible.
  ia_production: "This video was produced with the help of artificial intelligence tools: research, writing, synthetic voice and illustrations."
  # Ajoutée à la ligne précédente seulement si un humain nommé a relu. Jamais sous auto-approve.
  ia_controle_humain: "The script was reviewed and approved by a human before publication."
# Intitulés des blocs de description, dans la langue de la vidéo (étape 21).
libelles:
  sources: "Sources"
  credits: "Credits"
  generated_locally: "Illustrations generated locally"
titres:
  # Question de repli du commentaire épinglé, employée seulement quand le script
  # n'en pose aucune (étape 21). Vide = aucun commentaire épinglé.
  question_engagement: "Which part of this surprised you the most?"
  # Heuristique de production (étape 13.2), pas une citation de la politique « spam,
  # pratiques trompeuses et arnaques » : un titre qui porte un de ces mots est écarté
  # du choix automatique, il n'est pas supprimé du manifeste.
  mots_interdits:
    - "shocking"
    - "you won't believe"
    - "you wont believe"
    - "click here"
    - "subscribe now"
    - "free money"
    - "urgent"
    - "unbelievable"
    - "the truth they hide"
    - "banned secret"
    - "miracle"
    - "100% guaranteed"
    - "gone wrong"
  # Mots de curiosité mesurés sur les titres du corpus (étape 3) : ils ouvrent une boucle
  # sans rien promettre de faux. `_defaut` vaut pour toutes les niches ; la clé d'une niche
  # s'y ajoute, elle ne la remplace pas. Un seul par titre — trois empilés, c'est l'appât que
  # la politique spam vise. Note heuristique de l'étape 21, pas une citation de la politique.
  mots_curiosite:
    _defaut:
      - "nobody"
      - "actually"
      - "hidden"
      - "what happens"
      - "no one"
      - "still"
      - "never"
      - "until"
      - "why"
    science_pop:
      - "scientists"
      - "discovered"
      - "explains"
      - "impossible"
      - "beyond"
    histoire_doc:
      - "forgotten"
      - "untold"
      - "archives"
      - "disappeared"
      - "before"
tts:
  # Qwen3-TTS n'expose aucun paramètre de vitesse : `speed` est appliquée après synthèse par
  # `atempo` (ffmpeg), qui ne touche pas à la hauteur. 1,0 = débit natif du modèle.
  speed: 1.0
  # Respirations de la charte, en millisecondes.
  pauses_ms: { entre_segments_ms: 350, apres_hook_ms: 600, avant_sponsor_ms: 250 }
  # Sous 15 s, le WER de re-transcription décroche (étape 7) : `voice` fusionne avant de synthétiser.
  min_segment_s: 15.0
  silence_threshold_db: -45.0
asr:
  primary: parakeet
  fallback: whisper
  # Seuils fonction du nombre de mots du segment (mesures de l'étape 7).
  wer_thresholds: { "5": 0.20, "20": 0.15, "999": 0.08 }
# Étape 24 — déclinaison : adapter, jamais traduire mot à mot. Consignes en anglais (lues par le LLM).
localisation:
  consignes:
    - "Write for a US/UK audience: replace French cultural references, places, institutions and anecdotes with equivalents an English-speaking viewer knows, keeping the fact they illustrate."
    - "Units: imperial first, metric in parentheses when it matters (5 km -> about 3 miles (5 km); 70 kg -> about 155 pounds)."
    - "Numbers: 1,000 separator, decimal point; French 'milliard' = billion; spell dates as 'September 18, 2026'."
    - "Currency: convert euros to dollars as an order of magnitude ('about $50'), never keep a euro sign."
    - "Idioms: rewrite French idioms with a natural English idiom or plain words; no calques, no false friends (actuellement = currently, éventuellement = possibly)."
    - "Do not invent facts or numbers that the source does not contain; do not drop a number the source gives."
  rapport_longueur: { fr: 0.85, es: 0.80, it: 0.82 }
  glossaire:
    science_pop:
      - { source: "squat", cible: "squat" }
      - { source: "fessiers", cible: "glutes" }
      - { source: "quadriceps", cible: "quads" }
      - { source: "fréquence cardiaque", cible: "heart rate" }
      - { source: "tension artérielle", cible: "blood pressure" }
      - { source: "glycémie", cible: "blood sugar" }
      - { source: "OMS", cible: "WHO" }
      - { source: "Inserm", cible: "", note: "French public research institute: say 'France's national health research institute' once" }
    _defaut:
      - { source: "études", cible: "studies" }
