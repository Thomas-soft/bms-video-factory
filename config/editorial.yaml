schema_version: "1.0"
topics_queue: { taille_max: 200, score_minimal: 0.45, age_max_jours: 45 }
# Dédoublonnage par DISTANCE de Hamming, jamais par égalité, et de portée globale
# (toutes chaînes confondues) — CONFORMITE § 5.
dedupe: { script_simhash_distance_min: 12, thumbnail_phash_distance_min: 10, portee: globale }  # non lu : les seuils appliqués sont dans qc.yaml § precheck (étape 23.2)
angles_autorises: [opinion, comparaison_chiffree, test, donnee_proprietaire]
sources_blanches: [pexels, pixabay, openverse, wikimedia, nasa, internet_archive]
purge_cache_api_jours: 30       # Developer Policies III.E.4 : purge des données de tiers

# ═══════════════════════════════════════ étape 20 — percées, clusters, file de sujets
#
# Même règle qu'en 19 : tout arbitrage est ici, le code ne fait que mesurer et pondérer.
# Chaque seuil porte la raison de sa valeur — un nombre sans raison se change à l'aveugle.
topics:
  # Fenêtre d'observation, en jours. Le prompt de l'étape 20 la fixe à 180. Conséquence
  # MESURÉE le 20/09/2026 sur l'entrepôt : 5 597 vidéos, dont en 5 104 · fr 460 · tr 28 ·
  # es 5 · **it 0** — la chaîne italienne suivie (Biblioteca di Thoth) n'a rien publié
  # depuis le 02/02/2026. Le trou multilingue IT est donc structurellement vide dans
  # cette fenêtre, et le rapport l'écrit au lieu de laisser croire à une absence de trou.
  fenetre_jours: 180

  percees:
    # « ≥ 3 × la médiane de sa chaîne à âge comparable ». Même seuil qu'en 19 et que
    # registre/REFERENTIEL.md § 2 : trois seuils différents pour la même notion seraient
    # trois vérités.
    seuil_ratio: 3.0
    # Fenêtre d'âge : ±30 %. Comparer une vidéo de 10 jours à une de 300 mesurerait l'âge,
    # pas le succès.
    fenetre_age_relative: 0.30
    # Sous ce nombre de comparables, la médiane n'est pas une médiane. La vidéo n'est ni
    # percée ni non-percée : elle est **non notée**, et le rapport le dit.
    min_comparables: 5
    # Repli documenté : `views_d7` / `views_d30` (vue `v_video_views_at`) exigent DEUX
    # instantanés qui encadrent l'âge cible. Au 20/09/2026 l'entrepôt n'a qu'un jour de
    # collecte : ces colonnes sont NULL partout et la percée se mesure sur les vues
    # observées au dernier instantané. Le jour où deux jours seront en base, `preferer_dN`
    # rebascule sur la mesure exacte sans toucher au code.
    preferer_dN: true

  regroupement:
    # Agglomératif, cosinus, lien moyen (rapport de veille du 20/09/2026). Déterministe,
    # et sans classe « bruit » — HDBSCAN jette 30 % des titres courts.
    #
    # **Le 0,30-0,45 du rapport de veille est FAUX pour ce modèle, et c'est mesuré.**
    # `multilingual-e5-small` a un plancher de similarité très haut : sur 4 000 paires
    # tirées au hasard dans le corpus du 20/09/2026, le cosinus médian vaut **0,812** et
    # le 5ᵉ percentile **0,767**. Deux titres sans rapport sont donc déjà à 0,19 de
    # distance. Balayage mesuré sur les 5 604 titres :
    #
    #   | seuil | clusters ≥ 2 | isolés | plus gros cluster |
    #   |-------|--------------|--------|-------------------|
    #   | 0,08  |          604 |  2 913 |   151 (2,7 %)     |
    #   | 0,10  |          743 |  1 872 |   153 (2,7 %)     |
    #   | 0,12  |          738 |    904 |   153 (2,7 %)     |
    #   | 0,15  |          365 |    196 |   933 (16,6 %)    |
    #   | 0,18  |           83 |     28 | 3 246 (57,9 %)    |
    #   | 0,22  |            6 |      0 | 5 585 (99,7 %)    |
    #   | 0,35  |            1 |      0 | 5 604 (100 %)     |
    #
    # À 0,35, **tout le corpus est un seul cluster** : la valeur du rapport aurait produit
    # un résultat unique, faux, et silencieux. 0,12 retient le plus de groupes réels avec
    # le moins d'isolés, et le plus gros groupe reste à 2,7 % du corpus.
    # **Un changement de modèle d'embeddings impose de refaire ce balayage.**
    seuil_distance: 0.12
    # Un cluster d'une seule vidéo n'est pas un thème : il est écarté du classement,
    # mais compté dans le rapport (sinon le nombre de clusters ment).
    taille_min: 2
    # Aucune réduction de dimension : UMAP est stochastique et déforme les distances que
    # l'agglomératif compare (rapport de veille). 384 dimensions × 5 600 titres tiennent.
    reduction_dimension: false

  trous:
    multilingue:
      # Un seul sens : source fr/es/it → cible anglais. L'anglais est la seule langue de
      # production (ROADMAP § 3.1, Alek 15/09/2026).
      langues_source: [fr, es, it]
      langue_cible: en
      min_percees_source: 2
      max_videos_cible: 1
    demande:
      # « demande élevée, peu de vidéos récentes ». Le niveau de demande vient du seed
      # Wikipédia le plus proche du cluster (embeddings), avec les séries DÉJÀ en cache
      # de l'étape 19 : aucun appel réseau neuf.
      #
      # **Calibré, pas choisi.** `fenetre_recente_jours: 180` égalait la fenêtre du corpus :
      # « peu de vidéos récentes » devenait « petit cluster », et le critère se déclenchait
      # sur 150 clusters sur 738. Mesuré le 20/09/2026 : percentile 60 / 180 j → 150 ;
      # 80 / 90 j → 113 ; **90 / 90 j → 47** (6 % des clusters). Le décile supérieur de
      # demande et une fenêtre plus courte que le corpus : c'est la seule combinaison qui
      # discrimine.
      max_videos_recentes: 3
      fenetre_recente_jours: 90
      percentile_demande_min: 90
    resurgence:
      # Un cluster ancien qui regagne de la vélocité.
      #
      # **Deux corrections imposées par la mesure du 20/09/2026.**
      # (1) `age_median_min_jours: 365` était **inatteignable** : le corpus ne remonte qu'à
      #     180 jours, donc aucun cluster n'avait 365 jours d'âge médian et le critère ne
      #     pouvait jamais se déclencher. Porté à 120 j, atteignable dans la fenêtre.
      # (2) Le ratio se mesurait sur `velocity_life` = vues / âge, qui **décroît
      #     mécaniquement avec l'âge** : vélocité médiane de 4 736 vues/j entre 0 et 30
      #     jours, 227 entre 30 et 90, 150 entre 90 et 180 — facteur 31. Résultat : 9
      #     clusters éligibles sur 10 passaient le seuil, et 10 sur 10 avaient un ratio
      #     > 1,0. Le critère mesurait l'âge. Il porte désormais sur l'**indice de
      #     vélocité** (vélocité / médiane du décile d'âge du corpus).
      age_median_min_jours: 120
      ratio_velocite_min: 1.5
      min_videos_recentes: 2

  # Notation d'un sujet POUR UNE CHAÎNE. Somme à 1,00 ; le malus se retranche après.
  ponderations:
    force_cluster: 0.25       # vues totales du cluster, log puis min-max
    velocite: 0.20            # vélocité médiane des vidéos récentes du cluster
    lacune: 0.25              # trou multilingue > trou de demande > résurgence
    demande: 0.15             # niveau Wikimedia du seed le plus proche
    fit: 0.15                 # proximité du cluster à la niche de la chaîne (embeddings)
  # Barème de la lacune. Un trou multilingue vaut plus qu'une résurgence : c'est le modèle
  # Thoth, et c'est le seul avantage que le système ait sur un concurrent anglophone.
  bareme_lacune: { multilingue: 1.0, demande: 0.8, resurgence: 0.6, aucune: 0.0 }
  # Malus de répétition : similarité du sujet aux sujets DÉJÀ produits par BMS. En dessous
  # du seuil, aucun malus ; au-dessus, il croît jusqu'au poids plein à la similarité 1,0.
  # Le même seuil sert de refus dans `factory/steps/plan.py` : un seul nombre, une vérité.
  #
  # **0,80 était FAUX, et pour la même raison que le seuil de regroupement.** Ce modèle a
  # un plancher de similarité haut : deux sujets sans rapport sont déjà à 0,77-0,84.
  # Mesuré le 20/09/2026 sur les 30 sujets de `bms-science-en` :
  #   - deux sujets sans rapport (« charts électriques » / « mafia new-yorkaise ») : 0,767
  #   - un sujet contre les sujets BMS déjà produits : médiane 0,844
  #   - le même sujet à la casse près (vrai doublon)  : 0,994
  # À 0,80, **tous** les candidats de `bms-histoire-en` étaient rejetés et `plan` retombait
  # sur le référentiel sans que rien ne le signale. 0,92 sépare proprement : rien de
  # légitime ne l'atteint, un vrai doublon est à 0,99.
  malus_similarite: { seuil: 0.92, poids: 0.30 }
  # Un sujet trop proche d'un TITRE de concurrent est reformulé une fois par le LLM, puis
  # écarté s'il colle encore (CONFORMITE § 4-5 : un thème, jamais un titre repris).
  # **Vérifié, celui-là** : sur 30 sujets × 6 000 titres, le maximum légitime est **0,918**
  # (« The Science of Cosmic Alignment » contre « The real science of black holes », qui
  # n'est pas une reprise), et un vrai doublon est à 0,994. 0,95 passe entre les deux.
  reformulation_seuil: 0.95
  # Clusters envoyés au LLM pour libellé et angles. Au-delà, le coût de génération dépasse
  # l'usage : la file n'est consommée qu'à deux vidéos par semaine et par chaîne.
  clusters_libelles: 60
  clusters_angles: 30
  # Lots d'appels au LLM. Le contexte du 9B est plafonné à 8 k jetons (factory/llm.py).
  lot_libelles: 12
  lot_angles: 6
  # Angles autorisés — le prompt de l'étape 20 en nomme quatre. `angles_autorises` (haut de
  # ce fichier) reste la liste des SIGNATURES éditoriales de `script.py` : deux notions
  # voisines, deux usages, pas de fusion silencieuse.
  types_angle: [contrarien, comparatif_chiffre, recit, test]

# ═══════════════════════════════════════════════════ étape 19 — notation des niches
#
# Tout ce qui est SUBJECTIF est ici, jamais dans le code : les notes de monétisation
# et de faisabilité, leurs sources, leurs dates. `factory/editorial/niches.py` ne
# fait que lire, mesurer et pondérer.
#
# Les seeds Wikipédia ont été proposés par le LLM puis **validés par règle** le
# 20/09/2026 : `demand.articles_existent()` sur en.wikipedia, redirections suivies,
# titres canoniques écrits ici. 84 titres sur 88 existaient ; les 4 écarts sont
# corrigés en commentaire à leur ligne.
niche_scoring:
  ponderations: { demande: 35, concurrence: 25, monetisation: 25, faisabilite: 15 }

  demande:
    # L'autocomplete est passé de 0,20 à 0,10 après le contradicteur : le nombre de
    # suggestions sature à 10 par mot-clé (donc 50 pour les onze niches, identique), et
    # seule la diversité varie — un signal trop pauvre pour peser un cinquième.
    sous_ponderations: { niveau: 0.55, tendance: 0.35, autocomplete: 0.10 }
    fenetre_mois: 24          # deux ans : le minimum pour voir un mois civil deux fois
    # Pente mensuelle bornée avant normalisation : sans borne, un seul article qui
    # décuple emporte tout le sous-score de tendance des dix autres niches.
    pente_bornee: 0.06        # ±6 %/mois
    # Un seed dont l'ajustement log-linéaire est mauvais n'apporte pas sa pente : une
    # série plate et bruitée pesait autant qu'une tendance nette (r² = 0,0004 observé).
    r2_minimal: 0.3
    # Un mois n'est nommé « meilleur mois » qu'au-dessus de cet indice ET avec deux
    # observations. En dessous, 1,04 à 1,13 est du bruit publié à deux décimales.
    seuil_saison_nomme: 1.20
  concurrence:
    # `pression_velocite` compte À L'ENVERS : une vélocité médiane élevée sur les
    # vidéos récentes dit que les chaînes en place captent déjà l'attention. Comptée
    # positivement (version du 20/09 matin), elle faisait de `true_crime` — 31 320
    # vues/j de médiane — une niche « peu concurrentielle ».
    sous_ponderations: { rarete_chaines: 0.45, part_percees: 0.35, pression_velocite: 0.20 }
    chaine_active_videos_par_semaine: 1.0
    fenetre_activite_jours: 90
    fenetre_velocite_jours: 30
    fenetre_percees_jours: 365
    seuil_percee_ratio: 3.0   # même seuil que registre/REFERENTIEL.md § 2
    # Plancher de données : sous ces seuils la niche n'est PAS notée sur la concurrence.
    # Sans lui, « 0 chaîne active » vaut une rareté parfaite et l'ignorance paie.
    plancher_videos: 200
    plancher_chaines: 3
  wikimedia:
    max_appels_par_execution: 400
    source: "https://wikimedia.org/api/rest_v1/ — CC0, User-Agent identifiant obligatoire"
  autocomplete:
    # Point d'entrée NON DOCUMENTÉ. Plafond dur exigé par le prompt de l'étape 19.
    max_appels_par_execution: 200
    statut: "non documenté — aucun volume, seulement un ordre de suggestions"
  autocomplete_regions:
    en: { hl: en, gl: US }
    fr: { hl: fr, gl: FR }
    es: { hl: es, gl: ES }
    it: { hl: it, gl: IT }

  limites:
    - "**Wikipédia n'est pas YouTube.** Le niveau de demande est un nombre de lecteurs
      d'encyclopédie, pas de spectateurs. Il mesure la curiosité documentaire d'un sujet ;
      il ne dit rien de l'appétit pour une vidéo de 20 minutes sur ce sujet, et il
      sous-estime structurellement tout ce qui ne s'écrit pas en article : astuces
      domestiques, formats de divertissement, personnalités récentes."
    - "**La concurrence est mesurée sur 74 chaînes, pas sur YouTube.** L'entrepôt de
      l'étape 18 ne contient que le registre. « 3 chaînes actives » veut dire trois dans
      l'échantillon, pas trois au monde. Le sous-score de concurrence est donc un
      classement relatif entre niches du registre, jamais une mesure de saturation."
    - "**Une seule journée d'instantanés (20/09/2026).** La vélocité à 7 jours n'existe
      pas encore : `v_video_velocity` retombe sur `velocity_life` (vues ÷ âge). Une
      vidéo de deux jours à fort démarrage écrase une vidéo d'un an, et les ratios de
      percée montent jusqu'à 441. Le classement se stabilisera après une semaine de
      collecte ; à relancer alors."
    - "**Les niches candidates sont repérées par les mots de leurs titres**, pas par
      des chaînes étiquetées. Leur concurrence est donc sous-estimée par construction :
      on ne compte que les chaînes déjà suivies qui parlent du sujet."
    - "**Deux observations par mois civil.** L'indice de saisonnalité vient de 24 mois,
      soit deux passages par mois. La tendance est retirée avant le calcul (modèle
      multiplicatif log-linéaire) pour ne pas prendre une croissance pour un pic de
      saison, mais un indice sur n = 2 reste indicatif."
    - "**Les notes de monétisation et de faisabilité sont des jugements**, bornés 1-5,
      écrits dans ce fichier avec leur source. Elles pèsent 40 % du score composite.
      Un investisseur doit les lire avant le classement, pas après."
    - "**Les bandes de CPM ne sont pas comparables entre elles.** Une seule source
      ouvre des analytics réels (AIR Media-Tech, 300 chaînes, 3 595 mois monétisés,
      01/07/2026) ; elle publie du **RPM créateur**, pas du CPM annonceur. Les autres
      chiffres qui circulent viennent de blogs de marketing sans méthode publiée et
      se contredisent d'un facteur 5 à 25. Quatre thématiques sur onze n'ont
      **aucune donnée sourçable** et le disent."
    - "**Le sens du biais Wikipédia est connu, et il n'est pas neutre.** Il SURESTIME
      `histoire_doc` (articles de révision scolaire : un lecteur de « Roman Empire » révise,
      il ne cherche pas un documentaire de 25 minutes) et `espace_astronomie` (pics
      d'actualité JWST et Mars, qui ne se reproduisent pas sur commande). Il SOUS-ESTIME
      `home_hacks` et `sante_metabolique`, dont les sujets ne s'écrivent pas en article
      d'encyclopédie. Le classement doit se lire en le sachant."
    - "**Le dernier mois clos de Wikimedia n'est pas consolidé.** Mesuré le 20/09/2026 :
      le point d'entrée `monthly` rend 2 274 vues pour « Ancient Egypt » en août 2026, là
      où le point d'entrée `daily` du même mois donne 31 jours à ≈ 2 500 vues (≈ 78 000,
      l'ordre de grandeur de juillet). Laissé tel quel, ce seul point tirait la pente à
      −14 %/mois sur les onze niches à la fois. Les mois de queue sous 40 % de la médiane
      des six précédents sont donc retirés, et leur nombre est inscrit dans les preuves."
    - "**Google Trends : aucun accès.** API officielle en alpha sur candidature, aucune
      clé en self-service au 20/09/2026 ; trendspy écarté (points d'entrée internes,
      429). Le champ est nul, pas estimé."

  # ─────────────────── objections du contradicteur (20/09/2026) et ce qui a été fait
  # Format : problème → correction → statut. Une objection écartée dit pourquoi.
  objections:
    - probleme: "Le rang 1 (69) et le rang 2 (67) sont séparés par moins qu'un cran de
        note humaine : un cran de faisabilité ou de monétisation inverse le classement."
      correction: "Scores affichés sans décimale, et un bloc « Sensibilité » calcule ce que
        déplace un cran de note. Quand l'écart de tête est plus petit qu'un cran, le rapport
        écrit que les deux premières ne sont pas départagées."
      statut: appliquée
    - probleme: "L'en-tête affirmait que « les quatre sous-scores sont normalisés entre les
        niches ». Faux : monétisation et faisabilité viennent d'une échelle absolue, et
        elles pèsent 40 %."
      correction: "L'en-tête distingue les deux échelles et dit ce que vaut un 100 dans
        chacune."
      statut: appliquée
    - probleme: "`marches_predictifs` était classé 7/11 sans que le rapport mentionne
        l'interdit de la loi 2023-451 art. 4 VI, pourtant écrit dans la configuration."
      correction: "Porte éliminatoire : `eliminatoire: true` et son motif ; la niche est
        marquée ⛔, sortie du top 5, et son motif précède le classement. Même traitement
        pour `niche_monetisable_paris_sportifs`."
      statut: appliquée
    - probleme: "L'ignorance payait. `rarete = 1 − minmax(...)` donnait 1,000 à « 0 chaîne
        active » : `niche_monetisable_complements_fr` obtenait 45,0 de concurrence sur
        **0 vidéo et 0 chaîne** en anglais."
      correction: "Plancher de données — ≥ 200 vidéos et ≥ 3 chaînes. En dessous, les trois
        sous-mesures valent None, la concurrence tombe à 0 et le rapport écrit « sous le
        plancher, non notée »."
      statut: appliquée
    - probleme: "La vélocité médiane comptait POSITIVEMENT dans un score dit « inverse » :
        `true_crime`, dont les concurrents font 31 320 vues/j, passait pour peu
        concurrentielle. 55 % du sous-score était un second score de demande."
      correction: "Signe inversé et sous-score renommé `pression_velocite`. La lecture
        contraire — une vélocité élevée signale une niche vivante — est portée par le
        sous-score de demande, et c'est dit dans le code."
      statut: appliquée
    - probleme: "`r2` était calculé, stocké, jamais lu : la pente d'`espace_astronomie`
        agrégeait un seed à r² = 0,0004."
      correction: "Seuls les seeds à r² ≥ 0,3 apportent leur pente ; sans aucun, le rapport
        écrit « pente non significative » et donne le nombre de seeds ajustés."
      statut: appliquée
    - probleme: "Août et septembre n'ont qu'UNE observation après la coupe du mois non
        consolidé, et des indices de 1,04 à 1,13 étaient publiés comme des saisons."
      correction: "Un mois n'est nommé qu'avec n ≥ 2 observations ET un indice ≥ 1,20 ;
        le n est inscrit dans les preuves. Une niche sans mois qualifiant affiche « — »."
      statut: appliquée
    - probleme: "`(note − 1) / 4 × 100` écrasait la note 1 à 0, indiscernable d'une note
        absente."
      correction: "`note / 5 × 100`. Une note 1 vaut 20 ; 0 est réservé à l'absence."
      statut: appliquée
    - probleme: "Le niveau de demande était la SOMME des médianes des seeds : ajouter deux
        articles massifs à la configuration gonflait la niche."
      correction: "Médiane des seeds. La somme reste dans les preuves sous `niveau_somme`."
      statut: appliquée
    - probleme: "« 50 suggestions YouTube » était identique pour les onze niches
        (saturation à 10 par mot-clé) et publié comme une mesure."
      correction: "Le compte est retiré du rapport (il reste dans les preuves) et le poids
        de l'autocomplete passe de 0,20 à 0,10 au profit du niveau et de la tendance."
      statut: appliquée
    - probleme: "Le sens du biais Wikipédia n'était pas écrit."
      correction: "Une limite nomme les deux sens et les niches concernées."
      statut: appliquée
    - probleme: "Un min-max sur onze points : retirer une niche recalcule les dix autres."
      correction: "Écrit dans l'en-tête : le tableau ne vaut qu'à périmètre constant."
      statut: appliquée
    - probleme: "`cpm_fiabilite` n'est jamais lu : le 2/5 de `spiritualite` (fiabilité 1,
        aucune bande sourçable) pèse autant que celui de `longevite` (fiabilité 4, 3 595
        mois mesurés). Correction proposée : rapprocher la note de 2,5 selon la fiabilité."
      correction: "**Écartée dans l'arithmétique, appliquée à l'affichage.** Rapprocher de
        2,5 ferait REMONTER une note basse peu fiable : `spiritualite` passerait de 2 à 2,5
        et dépasserait `longevite`, mesurée basse. On récompenserait l'absence de donnée —
        exactement le défaut que le plancher de données vient de corriger. La fiabilité est
        donc affichée à côté de chaque note, et laissée au lecteur."
      statut: écartée, motivée
    - probleme: "Dix pentes sur onze sont négatives ; les deux positives sont les niches de
        paris (élection américaine). Correction proposée : centrer les pentes sur leur
        médiane."
      correction: "**Écartée : sans effet.** Le min-max est invariant par translation —
        centrer ne change aucun classement. Le fond de l'objection (un pic ponctuel lu comme
        une tendance) est traité par le filtre r², qui écarte les séries mal ajustées."
      statut: écartée, motivée

# ────────────────────────────────────────────────────────── les onze niches notées
#
# `origine: registre`  — les 8 niches de registre/REFERENTIEL.md § 1.
# `origine: candidate` — 3 propositions du LLM tirées des percées de l'entrepôt,
#                        absentes du registre, notées à la même grille.
#
# `labels_entrepot` reprend les étiquettes telles qu'elles sont en base, y compris
# les trois fusionnées par l'étape 3 (`frugal` et `yoder` → home_hacks, `moreno` →
# spiritualite) : la fusion est actée dans REFERENTIEL.md, pas dans channels_watch.
niches_notees:

  histoire_doc:
    origine: registre
    labels_entrepot: [histoire_doc]
    seeds_wikipedia: [Ancient Egypt, Roman Empire, World War II, Cold War,
                      Ottoman Empire, Mesopotamia, Vikings, French Revolution]
    mots_cles: [history documentary, ancient history, world war 2 documentary,
                lost civilizations, medieval history]
    monetisation:
      en:
        note: 4
        resume: "RPM mesuré le plus haut de l'échantillon, affiliation livres"
        cpm_bande_usd: { min: 2.31, max: 19.50, mediane: 10.22, unite: "RPM créateur" }
