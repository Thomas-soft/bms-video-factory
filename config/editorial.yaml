# ═══════════════════════════════════════ étape 26 — apprentissage (`factory learn`)
#
# Peu de données au début : ces seuils décident quand le système a le droit d'agir.
apprentissage:
  # Sous ce n par niveau, le multiplicateur reste 1,0 (le référentiel décide).
  n_min_par_niveau: 8
  # Et au-dessus du seuil, il faut encore P(effet > 0) ≥ 0,95 (ou ≤ 0,05) pour agir.
  # 0,8 donnait ~20 % de faux positifs par niveau sur ~60 niveaux (contradicteur, 23/09/2026).
  prob_min_action: 0.95
  # Bornes des multiplicateurs : le système ne peut ni doubler ni annuler un choix.
  multiplicateur_min: 0.7
  multiplicateur_max: 1.4
  # Rythme de coupe : ±20 % au plus autour de la cible du référentiel.
  rythme_ajustement_max: 0.20
  # Médiane de chaîne : sous 3 autres vidéos, rétrécie vers la médiane de la niche.
  n_min_chaine_mediane: 3
  # Règle de rétention candidate : au moins 6 segments observés.
  n_min_regle_retention: 6
  # Banc vs résultats : docs/QC.md § 8 exige n ≥ 30 avant de toucher aux seuils.
  n_min_banc: 30
  # Thompson (miniatures) : a priori Beta de 200 impressions au CTR médian de la chaîne.
  thompson_force_prior: 200
  ctr_prior_defaut: 0.04
  # Facteurs gelés (multiplicateur 1,0 quel que soit n) — contradicteur du 23/09/2026 :
  # niche, style, lang, voice_id, is_child sont constants par chaîne, donc ≈ 0 par
  # construction une fois y centré sur la chaîne ; publish_hour/weekday portent un artefact
  # de fenêtre (J0 en UTC, perf_daily en heure du Pacifique) tant que la vue n'est pas corrigée.
  facteurs_geles: [niche, style, lang, voice_id, is_child, publish_hour, publish_weekday]
  # Gel global : aucun multiplicateur actif avant 30 vidéos à y calculable ET 3 chaînes à
  # ≥ 5 vidéos chacune.
  n_min_global: 30
  n_min_chaines: 3
  n_min_par_chaine: 5
  # Gel sur tendance : si l'effet rétréci du rang de publication dépasse 0,10 (log), la
  # croissance de la chaîne se confond avec tout facteur adopté tard.
  tendance_max: 0.10
